<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VNumber Success</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
color:#fff;
background:
radial-gradient(circle at 20% 20%,#06b6d433,transparent 30%),
radial-gradient(circle at 80% 20%,#8b5cf633,transparent 30%),
radial-gradient(circle at 50% 100%,#ec489933,transparent 35%),
#020617;
}

.container{
width:min(92%,520px);
text-align:center;
padding:40px 25px;
background:#ffffff0b;
border:1px solid #ffffff18;
border-radius:30px;
box-shadow:0 25px 80px #0009;
backdrop-filter:blur(15px);
position:relative;
z-index:2;
}

.logo{
font-size:22px;
font-weight:bold;
color:#22d3ee;
margin-bottom:30px;
}

.phone{
font-size:55px;
margin-bottom:15px;
animation:phoneFloat 2s ease-in-out infinite;
filter:drop-shadow(0 0 25px #22d3ee);
}

@keyframes phoneFloat{
0%,100%{transform:translateY(0) rotate(-4deg)}
50%{transform:translateY(-10px) rotate(4deg)}
}

h1{
font-size:25px;
margin-bottom:12px;
}

p{
color:#94a3b8;
line-height:2;
margin-bottom:25px;
}

.number{
display:inline-block;
padding:12px 20px;
border-radius:15px;
background:#22d3ee12;
border:1px solid #22d3ee44;
color:#67e8f9;
font-size:18px;
direction:ltr;
margin-bottom:25px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#06b6d4,#7c3aed,#ec4899);
background-size:200% 200%;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
animation:buttonGlow 3s ease infinite;
transition:.2s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 10px 35px #8b5cf666;
}

@keyframes buttonGlow{
0%,100%{background-position:0 50%}
50%{background-position:100% 50%}
}

/* صفحه موفقیت */
.success{
position:fixed;
inset:0;
z-index:10;
display:none;
align-items:center;
justify-content:center;
background:#020617ee;
backdrop-filter:blur(12px);
opacity:0;
}

.success.show{
display:flex;
animation:successIn .5s ease forwards;
}

@keyframes successIn{
to{opacity:1}
}

.success-box{
text-align:center;
padding:35px 25px;
width:min(90%,500px);
}

.check{
width:120px;
height:120px;
margin:auto auto 25px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:65px;
background:linear-gradient(135deg,#10b981,#22c55e);
box-shadow:
0 0 0 10px #22c55e18,
0 0 50px #22c55e99;
animation:checkPop .7s cubic-bezier(.17,.89,.32,1.49);
}

@keyframes checkPop{
0%{transform:scale(0) rotate(-90deg)}
70%{transform:scale(1.15) rotate(10deg)}
100%{transform:scale(1) rotate(0)}
}

.success h2{
font-size:30px;
margin-bottom:12px;
color:#86efac;
}

.success p{
font-size:16px;
}

.order{
padding:15px;
border-radius:15px;
background:#ffffff0a;
border:1px solid #ffffff15;
margin-bottom:20px;
}

.order strong{
display:block;
color:#22d3ee;
font-size:20px;
margin-top:8px;
direction:ltr;
}

/* ذرات */
.particle{
position:fixed;
pointer-events:none;
z-index:20;
font-size:25px;
animation:explode 1.8s cubic-bezier(.15,.8,.25,1) forwards;
will-change:transform,opacity;
}

@keyframes explode{
0%{
transform:translate(0,0) scale(.2) rotate(0);
opacity:1;
}
100%{
transform:translate(var(--x),var(--y)) scale(1.3) rotate(720deg);
opacity:0;
}
}

/* حلقه نور */
.ring{
position:fixed;
left:50%;
top:50%;
width:80px;
height:80px;
border:3px solid #22c55e;
border-radius:50%;
pointer-events:none;
z-index:15;
transform:translate(-50%,-50%);
animation:ringExpand 1s ease-out forwards;
}

@keyframes ringExpand{
from{
width:80px;
height:80px;
opacity:1;
}
to{
width:900px;
height:900px;
opacity:0;
}
}

/* موبایل */
@media(max-width:500px){
.container{padding:30px 20px}
h1{font-size:21px}
.phone{font-size:48px}
.success h2{font-size:25px}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">📱 VNumber Shop</div>

<div class="phone">📱</div>

<h1>خرید شماره مجازی</h1>

<p>
برای تست، روی دکمه زیر بزن تا ببینی
بعد از موفقیت خرید چه افکت خفنی نمایش داده می‌شود.
</p>

<div class="number">
+62 812 3456 7890
</div>

<button onclick="purchaseSuccess()">
🎉 شماره با موفقیت خریداری شد
</button>

</div>

<div id="success" class="success">

<div class="success-box">

<div class="check">✓</div>

<h2>خرید با موفقیت انجام شد! 🎉</h2>

<p>
تبریک! شماره مجازی شما با موفقیت خریداری شد
و آماده استفاده است 🚀
</p>

<div class="order">

شماره خریداری‌شده:

<strong>+62 812 3456 7890</strong>

</div>

<button onclick="closeSuccess()">
📦 مشاهده سفارش
</button>

</div>

</div>

<script>

const emojis=[
"🎉","✨","🚀","💎","🔥","🎊",
"⭐","💚","📱","⚡","🥳","🏆",
"💫","🌟","🎈","🪩"
];

function purchaseSuccess(){

const success=document.getElementById("success");

success.classList.add("show");

createRing();

for(let i=0;i<55;i++){
setTimeout(()=>{
createParticle();
},i*25);
}

}

function createRing(){

const ring=document.createElement("div");

ring.className="ring";

document.body.appendChild(ring);

setTimeout(()=>{
ring.remove();
},1100);

}

function createParticle(){

const p=document.createElement("div");

p.className="particle";

p.textContent=
emojis[Math.floor(Math.random()*emojis.length)];

const angle=Math.random()*Math.PI*2;

const distance=
Math.random()*350+180;

const x=Math.cos(angle)*distance;

const y=Math.sin(angle)*distance;

p.style.left="50%";

p.style.top="50%";

p.style.setProperty(
"--x",
x+"px"
);

p.style.setProperty(
"--y",
y+"px"
);

p.style.transform=
"translate(-50%,-50%)";

document.body.appendChild(p);

setTimeout(()=>{
p.remove();
},1900);

}

function closeSuccess(){

document.getElementById("success")
.classList.remove("show");

}

</script>

</body>
</html>
